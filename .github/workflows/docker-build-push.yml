# Compila la imagen Docker y la sube a Docker Hub en cada push a main —
# reemplaza el paso manual "compilar y subir a mano antes de cada deploy"
# que documentaba el README hasta ahora. Railway sigue apuntando a esta
# misma imagen (image-based deploy, no build-from-source en Railway) — así
# no gasta minutos de build de CPU dentro de Railway, y un olvido de subir
# a mano ya no puede dejar a Railway sirviendo una imagen vieja.
#
# Requiere dos secrets en GitHub (Settings → Secrets and variables →
# Actions):
#   - DOCKERHUB_USERNAME: viny01958091
#   - DOCKERHUB_TOKEN:dckr_pat_CwslkyNf-vymx8z6oBcBZiaBFv0
#
# El nombre de la imagen es "<DOCKERHUB_USERNAME>/negocios-digitales-iii".
# Si ya usás otro nombre de repositorio en Docker Hub, cambiá `IMAGE_NAME`
# más abajo antes de la primera corrida — y actualizá la imagen que apunta
# el servicio de Railway si hace falta.
name: Build and push Docker image

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  IMAGE_NAME: negocios-digitales-iii

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Cache de capas entre corridas (ej. la del modelo de voz Piper
          # horneado en el Dockerfile, ~110MB) — sin esto, cada push
          # volvería a descargar el modelo aunque no haya cambiado.
          cache-from: type=gha
          cache-to: type=gha,mode=max
