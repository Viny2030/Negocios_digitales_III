[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1
# numReplicas se deja fijo en 1 a propósito: este servicio sostiene UN
# stream RTMP hacia UNA clave de transmisión de YouTube (RTMP_STREAM_KEY).
# Con más de una réplica, cada una arrancaría su propio ffmpeg empujando al
# mismo destino RTMP — YouTube rechaza o corta conexiones duplicadas a la
# misma stream key, así que escalar horizontalmente rompe la emisión en vez
# de mejorarla.
